<figure class="list table-like"><figcaption><span class="type">List</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.4.3<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Basic argument forms - rule of inference<div class="autopermalink" aria-hidden="true" data-description="List 2.4.3: Basic argument forms - rule of inference"><a tabindex="-1" href="#list-logical-arguments" title="Copy heading and permalink for List 2.4.3: Basic argument forms - rule of inference" aria-label="Copy heading and permalink for List 2.4.3: Basic argument forms - rule of inference">🔗</a></div></figcaption><div class="named-list-content">
<div class="introduction">
<div class="para">Let <span class="process-math">\(p, q \and r\)</span> be logical propositions. The following are tautologies:<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</div>
<dl class="description-list narrow">
<dt>Modus Ponens/Direct reasoning<div class="autopermalink" aria-hidden="true" data-description="Item: Modus Ponens/Direct reasoning"><a tabindex="-1" href="#list-logical-arguments-3-1" title="Copy heading and permalink for Item: Modus Ponens/Direct reasoning" aria-label="Copy heading and permalink for Item: Modus Ponens/Direct reasoning">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\displaystyle (p\to q) \land p \Rightarrow q\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-3-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Modus Tollens / Indirect Reasoning<div class="autopermalink" aria-hidden="true" data-description="Item: Modus Tollens / Indirect Reasoning"><a tabindex="-1" href="#list-logical-arguments-3-2" title="Copy heading and permalink for Item: Modus Tollens / Indirect Reasoning" aria-label="Copy heading and permalink for Item: Modus Tollens / Indirect Reasoning">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\displaystyle (p \to  q) \land  \neg q \Rightarrow  \neg p\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-3-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Disjunctive Addition<div class="autopermalink" aria-hidden="true" data-description="Item: Disjunctive Addition"><a tabindex="-1" href="#list-logical-arguments-3-3" title="Copy heading and permalink for Item: Disjunctive Addition" aria-label="Copy heading and permalink for Item: Disjunctive Addition">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\displaystyle p\Rightarrow (p\lor q)\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-3-3-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Conjunctive Simplification<div class="autopermalink" aria-hidden="true" data-description="Item: Conjunctive Simplification"><a tabindex="-1" href="#list-logical-arguments-3-4" title="Copy heading and permalink for Item: Conjunctive Simplification" aria-label="Copy heading and permalink for Item: Conjunctive Simplification">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\((p \land  q) \Rightarrow  p\)</span> <br>  <span class="process-math">\((p \land  q) \Rightarrow  q\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-3-4-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Disjunctive Simplification<div class="autopermalink" aria-hidden="true" data-description="Item: Disjunctive Simplification"><a tabindex="-1" href="#list-logical-arguments-3-5" title="Copy heading and permalink for Item: Disjunctive Simplification" aria-label="Copy heading and permalink for Item: Disjunctive Simplification">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\((p \lor  q) \land  \neg p \Rightarrow  q\)</span> <br>  <span class="process-math">\((p \lor q) \land \neg q\Rightarrow p\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-3-5-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Chain Argument / Syllogism<div class="autopermalink" aria-hidden="true" data-description="Item: Chain Argument / Syllogism"><a tabindex="-1" href="#list-logical-arguments-3-6" title="Copy heading and permalink for Item: Chain Argument / Syllogism" aria-label="Copy heading and permalink for Item: Chain Argument / Syllogism">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\displaystyle (p \to  q) \land  ( q \rightarrow  r) \Rightarrow  (p\to  r)\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-3-6-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Conjunction<div class="autopermalink" aria-hidden="true" data-description="Item: Conjunction"><a tabindex="-1" href="#list-logical-arguments-3-7" title="Copy heading and permalink for Item: Conjunction" aria-label="Copy heading and permalink for Item: Conjunction">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\displaystyle (p) \land (q) \Rightarrow (p \land q)\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-3-7-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Resolution<div class="autopermalink" aria-hidden="true" data-description="Item: Resolution"><a tabindex="-1" href="#list-logical-arguments-3-8" title="Copy heading and permalink for Item: Resolution" aria-label="Copy heading and permalink for Item: Resolution">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\displaystyle (p \lor q) \land (\neg p \lor r) \Rightarrow (q \lor r)\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-arguments-3-8-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>

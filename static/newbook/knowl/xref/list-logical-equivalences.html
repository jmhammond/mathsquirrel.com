<figure class="list table-like"><figcaption><span class="type">List</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.1.5<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Fundamental logical equivalences<div class="autopermalink" aria-hidden="true" data-description="List 2.1.5: Fundamental logical equivalences"><a tabindex="-1" href="#list-logical-equivalences" title="Copy heading and permalink for List 2.1.5: Fundamental logical equivalences" aria-label="Copy heading and permalink for List 2.1.5: Fundamental logical equivalences">🔗</a></div></figcaption><div class="named-list-content">
<div class="introduction">
<div class="para">Let <span class="process-math">\(p, q\)</span> and <span class="process-math">\(r\)</span> be logical propositions.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</div>
<dl class="description-list narrow">
<dt>Commutative Laws<div class="autopermalink" aria-hidden="true" data-description="Item: Commutative Laws"><a tabindex="-1" href="#list-logical-equivalences-3-1" title="Copy heading and permalink for Item: Commutative Laws" aria-label="Copy heading and permalink for Item: Commutative Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(p \lor  q\equiv q\lor p\)</span> <br> <span class="process-math">\(p \land q\equiv q \land p\)</span> <div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Associative Laws<div class="autopermalink" aria-hidden="true" data-description="Item: Associative Laws"><a tabindex="-1" href="#list-logical-equivalences-3-2" title="Copy heading and permalink for Item: Associative Laws" aria-label="Copy heading and permalink for Item: Associative Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\((p \lor  q) \lor r \equiv  p \lor  (q \lor  r)\)</span> <br>  <span class="process-math">\((p \land q) \land r\equiv p \land  (q \land  r)\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Distributive Laws<div class="autopermalink" aria-hidden="true" data-description="Item: Distributive Laws"><a tabindex="-1" href="#list-logical-equivalences-3-3" title="Copy heading and permalink for Item: Distributive Laws" aria-label="Copy heading and permalink for Item: Distributive Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(p \land  (q \lor  r) \equiv  (p \land  q ) \lor  (p \land  r)\)</span> <br>  <span class="process-math">\(p \lor  (q \land  r) \equiv  (p \lor  q) \land (p \lor r)\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-3-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Identity Laws<div class="autopermalink" aria-hidden="true" data-description="Item: Identity Laws"><a tabindex="-1" href="#list-logical-equivalences-3-4" title="Copy heading and permalink for Item: Identity Laws" aria-label="Copy heading and permalink for Item: Identity Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(p \lor  F\equiv p\)</span> <br>  <span class="process-math">\(p \land  T \equiv p\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-4-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Negation Laws<div class="autopermalink" aria-hidden="true" data-description="Item: Negation Laws"><a tabindex="-1" href="#list-logical-equivalences-3-5" title="Copy heading and permalink for Item: Negation Laws" aria-label="Copy heading and permalink for Item: Negation Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(p\land \neg p\equiv F\)</span> <br> <span class="process-math">\(p\lor \neg p\equiv T\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-5-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Idempotent Laws<div class="autopermalink" aria-hidden="true" data-description="Item: Idempotent Laws"><a tabindex="-1" href="#list-logical-equivalences-3-6" title="Copy heading and permalink for Item: Idempotent Laws" aria-label="Copy heading and permalink for Item: Idempotent Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(p \lor  p \equiv p\)</span>  <br> <span class="process-math">\(p\land p \equiv p\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-6-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Domination Laws<div class="autopermalink" aria-hidden="true" data-description="Item: Domination Laws"><a tabindex="-1" href="#list-logical-equivalences-3-7" title="Copy heading and permalink for Item: Domination Laws" aria-label="Copy heading and permalink for Item: Domination Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(p \land F \equiv F\)</span> <br> <span class="process-math">\(p \lor  T \equiv T\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-7-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Absorption Laws<div class="autopermalink" aria-hidden="true" data-description="Item: Absorption Laws"><a tabindex="-1" href="#list-logical-equivalences-3-8" title="Copy heading and permalink for Item: Absorption Laws" aria-label="Copy heading and permalink for Item: Absorption Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(p \land (p\lor  q)\equiv p\)</span> <br> <span class="process-math">\(p \lor  (p \land  q) \equiv  p\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-8-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>DeMorgan’s Laws<div class="autopermalink" aria-hidden="true" data-description="Item: DeMorgan’s Laws"><a tabindex="-1" href="#list-logical-equivalences-3-9" title="Copy heading and permalink for Item: DeMorgan’s Laws" aria-label="Copy heading and permalink for Item: DeMorgan’s Laws">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\neg (p \lor  q) \equiv  (\neg p) \land  (\neg q)\)</span> <br> <span class="process-math">\(\neg (p \land  q) \equiv  (\neg p) \lor  (\neg q)\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-9-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Double Negation Law<div class="autopermalink" aria-hidden="true" data-description="Item: Double Negation Law"><a tabindex="-1" href="#list-logical-equivalences-3-10" title="Copy heading and permalink for Item: Double Negation Law" aria-label="Copy heading and permalink for Item: Double Negation Law">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\displaystyle \neg (\neg p)\equiv p\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-10-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
<dt>Implication<div class="autopermalink" aria-hidden="true" data-description="Item: Implication"><a tabindex="-1" href="#list-logical-equivalences-3-11" title="Copy heading and permalink for Item: Implication" aria-label="Copy heading and permalink for Item: Implication">🔗</a></div>
</dt>
<dd>
<div class="para">
<span class="process-math">\(\displaystyle p \to q \equiv \neg p \lor q\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#list-logical-equivalences-3-11-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</dd>
</dl>
</div>
